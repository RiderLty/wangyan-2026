<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 540" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="100%" height="100%" fill="white"/><!--svg-bg-white-->
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748B"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#64748B"/></marker></defs>
<polyline points="270,110 360,110 360,180 385,180" stroke="#64748B" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a2)"/>
<polyline points="270,300 360,300 360,210 385,210" stroke="#64748B" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a2)"/>
<text x="345" y="96" font-size="12.5" fill="#475569" text-anchor="middle">增量与光标双向广播</text>
<polyline points="640,245 640,345 920,345 920,366" stroke="#64748B" stroke-width="1.8" fill="none" marker-end="url(#a)" marker-start="url(#a2)"/>
<text x="780" y="333" font-size="12.5" fill="#475569" text-anchor="middle">写入：每帧缓冲 2 秒，合并后追加</text>
<text x="665" y="362" font-size="12.5" fill="#475569" text-anchor="middle">读取：按自增序回放历史增量</text>
<polyline points="1180,366 1180,268 700,268 700,245" stroke="#64748B" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="940" y="256" font-size="12.5" fill="#475569" text-anchor="middle">无增量时：从快照播种并写入种子帧</text>
<polyline points="620,245 620,470 1180,470 1180,434" stroke="#64748B" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<text x="900" y="456" font-size="12.5" fill="#475569" text-anchor="middle">会话结束：合并回写快照、压缩旧增量，回写前做防误清检查</text>
<rect x="70.0" y="76.0" width="200" height="68" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/><text x="170" y="101" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">客户端 A</text><text x="170" y="124" font-size="11.5" fill="#64748B" text-anchor="middle">协作编辑器（Yjs 前端）</text>
<rect x="70.0" y="266.0" width="200" height="68" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/><text x="170" y="291" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">客户端 B</text><text x="170" y="314" font-size="11.5" fill="#64748B" text-anchor="middle">协作编辑器（Yjs 前端）</text>
<rect x="385.0" y="135.0" width="340" height="110" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/><text x="555" y="181" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">y-websocket 服务端</text><text x="555" y="204" font-size="11.5" fill="#64748B" text-anchor="middle">内存中的 Yjs 文档</text>
<rect x="810.0" y="366.0" width="220" height="68" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/><text x="920" y="391" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">增量日志</text><text x="920" y="414" font-size="11.5" fill="#64748B" text-anchor="middle">yjs_updates</text>
<rect x="1080.0" y="366.0" width="200" height="68" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/><text x="1180" y="391" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle" dominant-baseline="middle">快照</text><text x="1180" y="414" font-size="11.5" fill="#64748B" text-anchor="middle">notes.content</text>
<text x="670" y="515" font-size="12.5" fill="#64748B" text-anchor="middle">增量的实时广播走内存路径，与持久化完全异步，键入传播不受落盘耗时影响</text>
</svg>