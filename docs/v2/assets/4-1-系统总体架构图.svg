<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 900" font-family="'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="white"/><!--svg-bg-white-->
  <defs>
    <style>
      .layer{fill:#F8FAFC;stroke:#94A3B8;stroke-width:2;rx:8}
      .chip{fill:#FFFFFF;stroke:#64748B;stroke-width:1.6}
      .chip-ai{fill:#E0E7FF;stroke:#4F46E5;stroke-width:2.2}
      .chip-db{fill:#F1F5F9;stroke:#64748B;stroke-width:1.6}
      .lname{fill:#334155;font-size:16px;font-weight:700}
      .chip-t{fill:#1E293B;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
      .chip-s{fill:#64748B;font-size:12.5px;text-anchor:middle}
      .arrow{stroke:#64748B;stroke-width:2;fill:#64748B}
      .arrow-line{stroke:#64748B;stroke-width:2;fill:none}
      .alabel{fill:#475569;font-size:13px;text-anchor:middle}
      .ext{fill:none;stroke:#4F46E5;stroke-width:1.8;stroke-dasharray:7 4}
      .ext-t{fill:#312E81;font-size:14px;font-weight:600;text-anchor:middle}
    </style>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- ===== 表现层 ===== -->
  <rect x="110" y="40" width="850" height="150" rx="8" class="layer"/>
  <text x="130" y="66" class="lname">表现层</text>
  <text x="215" y="66" class="alabel" style="text-anchor:start;font-weight:400">React 单页应用</text>
  <rect x="140" y="90" width="185" height="76" rx="6" class="chip"/>
  <text x="232" y="120" class="chip-t">登录与注册</text>
  <rect x="345" y="90" width="185" height="76" rx="6" class="chip"/>
  <text x="437" y="118" class="chip-t">工作台</text>
  <text x="437" y="146" class="chip-s">笔记、协作、团队、分享</text>
  <rect x="550" y="90" width="215" height="76" rx="6" class="chip-ai"/>
  <text x="657" y="118" class="chip-t">AI 交互界面</text>
  <text x="657" y="146" class="chip-s">智能菜单、助手抽屉、智能搜索</text>
  <rect x="785" y="90" width="150" height="76" rx="6" class="chip"/>
  <text x="860" y="118" class="chip-t">打印与导出</text>
  <text x="860" y="146" class="chip-s">PDF 视图、Markdown</text>

  <!-- 箭头：表现层 → 网关层 -->
  <line x1="400" y1="190" x2="400" y2="238" class="arrow-line" marker-end="url(#ah)"/>
  <text x="400" y="222" class="alabel">HTTP / HTTPS</text>
  <line x1="680" y1="190" x2="680" y2="238" class="arrow-line" marker-end="url(#ah)"/>
  <text x="680" y="222" class="alabel">WebSocket</text>

  <!-- ===== 网关层 ===== -->
  <rect x="110" y="245" width="850" height="105" rx="8" class="layer"/>
  <text x="130" y="271" class="lname">网关层</text>
  <text x="205" y="271" class="alabel" style="text-anchor:start;font-weight:400">Nginx</text>
  <rect x="180" y="285" width="240" height="48" rx="6" class="chip"/>
  <text x="300" y="309" class="chip-t">静态资源托管</text>
  <rect x="460" y="285" width="240" height="48" rx="6" class="chip"/>
  <text x="580" y="309" class="chip-t">/api 接口反向代理</text>
  <rect x="740" y="285" width="195" height="48" rx="6" class="chip"/>
  <text x="837" y="309" class="chip-t">/ws 协作通道反代</text>

  <!-- 箭头：网关层 → 应用层 -->
  <line x1="535" y1="350" x2="535" y2="398" class="arrow-line" marker-end="url(#ah)"/>
  <text x="535" y="382" class="alabel">转发至应用进程</text>

  <!-- ===== 应用层 ===== -->
  <rect x="110" y="405" width="850" height="235" rx="8" class="layer"/>
  <text x="130" y="431" class="lname">应用层</text>
  <text x="215" y="431" class="alabel" style="text-anchor:start;font-weight:400">NestJS 模块化单体（REST 与 WebSocket 共进程）</text>
  <rect x="140" y="450" width="125" height="48" rx="6" class="chip"/>
  <text x="202" y="474" class="chip-t">用户认证</text>
  <rect x="277" y="450" width="125" height="48" rx="6" class="chip"/>
  <text x="339" y="474" class="chip-t">笔记管理</text>
  <rect x="414" y="450" width="125" height="48" rx="6" class="chip"/>
  <text x="476" y="474" class="chip-t">回收站</text>
  <rect x="551" y="450" width="125" height="48" rx="6" class="chip"/>
  <text x="613" y="474" class="chip-t">团队协作</text>
  <rect x="688" y="450" width="125" height="48" rx="6" class="chip"/>
  <text x="750" y="474" class="chip-t">笔记分享</text>
  <rect x="825" y="450" width="118" height="48" rx="6" class="chip"/>
  <text x="884" y="474" class="chip-t">实时协作</text>
  <rect x="140" y="520" width="803" height="92" rx="6" class="chip-ai"/>
  <text x="541" y="552" class="chip-t" fill="#312E81">AI 智能辅助模块</text>
  <text x="541" y="588" class="chip-s">LLM 网关（流式、工具调用聚合）｜智能体循环｜智能整理｜混合检索与问答</text>

  <!-- 箭头：应用层 → 数据层 -->
  <line x1="400" y1="640" x2="400" y2="688" class="arrow-line" marker-end="url(#ah)"/>
  <text x="400" y="672" class="alabel">ORM / SQL</text>
  <line x1="680" y1="640" x2="680" y2="688" class="arrow-line" marker-end="url(#ah)"/>
  <text x="680" y="672" class="alabel">缓存读写</text>

  <!-- ===== 数据层 ===== -->
  <rect x="110" y="695" width="850" height="150" rx="8" class="layer"/>
  <text x="130" y="721" class="lname">数据层</text>
  <rect x="180" y="735" width="430" height="90" rx="6" class="chip-db"/>
  <text x="395" y="762" class="chip-t">PostgreSQL（pgvector）</text>
  <text x="395" y="798" class="chip-s">笔记正文 JSONB ｜ 协作增量二进制 ｜ AI 向量数据</text>
  <rect x="650" y="735" width="280" height="90" rx="6" class="chip-db"/>
  <text x="790" y="762" class="chip-t">Redis</text>
  <text x="790" y="798" class="chip-s">分享缓存 ｜ 登出黑名单 ｜ 会话支撑</text>

  <!-- ===== 外部模型服务（虚线框 + 出网箭头） ===== -->
  <rect x="1000" y="520" width="130" height="110" rx="8" class="ext"/>
  <text x="1065" y="562" class="ext-t">模型服务</text>
  <text x="1065" y="588" class="chip-s">DeepSeek API</text>
  <text x="1065" y="610" class="chip-s">嵌入模型 API</text>
  <line x1="943" y1="566" x2="996" y2="566" class="arrow-line" stroke="#4F46E5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="969" y="550" class="alabel" fill="#4338CA" font-size="12">出网</text>
</svg>
